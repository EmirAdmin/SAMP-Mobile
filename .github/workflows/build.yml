name: Build SAMP Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10

      - name: Fix repositories and dependency
        run: |
          # حذف ریپازیتوری خراب
          sed -i '/mint.splunk.com/d' build.gradle || true
          sed -i '/mint.splunk.com/d' app/build.gradle || true

          # اضافه کردن JitPack به settings.gradle (اگر وجود دارد)
          if [ -f settings.gradle ]; then
            echo '
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
}' >> settings.gradle
          fi

          # اضافه کردن مستقیم در root build.gradle
          sed -i '/allprojects {/,/}/c\
allprojects {\
    repositories {\
        google()\
        mavenCentral()\
        maven { url "https://jitpack.io" }\
        maven { url "https://maven.aliyun.com/repository/public" }\
    }\
}' build.gradle || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;26.2.11394342"
          sdkmanager "cmake;3.22.1"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
