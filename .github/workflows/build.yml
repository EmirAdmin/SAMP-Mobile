name: Build SAMP Mobile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10

      - name: Fix repositories
        run: |
          sed -i '/mint.splunk.com/d' build.gradle || true
          sed -i '/mint.splunk.com/d' app/build.gradle || true
          printf '\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url "https://jitpack.io" }\n        maven { url "https://maven.aliyun.com/repository/public" }\n    }\n}\n' >> build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;26.2.11394342"
          sdkmanager "cmake;3.22.1"

      - name: Set NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
